<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Frankendom V2</title>
<style>
  /* the fight is a game surface, not a document: every browser gesture is refused (V1 style.css:1-5) */
  :root { touch-action: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9db7d6; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; font: 12px system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  .side { flex: 1; max-width: 160px; }
  .side.right { text-align: right; }
  .bar { height: 6px; margin-top: 3px; background: rgba(0,0,0,.35); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; }
  .hp i { background: #d23b3b; }
  .bar.flash { background: rgba(210,40,40,.75); } .st i { background: #e8c547; } .po i { background: #f2f2f2; }
  .side.right .bar i { margin-left: auto; }
  .name { color: #fff; text-shadow: 0 1px 2px #0008; font-weight: 600; }
  #msg { position: fixed; top: 38%; width: 100%; text-align: center; color: #fff; font-size: 28px; font-weight: 700; text-shadow: 0 2px 6px #000a; pointer-events: none; }
  #build { position: fixed; left: 8px; bottom: 4px; color: #ffffffaa; font-size: 9px; pointer-events: none; }
  .pad { position: fixed; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 9.5px; letter-spacing: 0; text-align: center; line-height: 1.1;
         background: rgba(20,24,32,.42); border: 2px solid rgba(255,255,255,.5); box-sizing: border-box; touch-action: none; }
  .pad.on { background: rgba(255,255,255,.35); }
  .pad.cool { opacity: .35; }
  #ring { position: fixed; border-radius: 50%; border: 1px dashed rgba(255,255,255,.45); pointer-events: none; box-sizing: border-box; }
  #ring b { position: absolute; color: #ffffffcc; font-size: 9px; font-weight: 600; }
  #stick { position: fixed; left: 0; bottom: 0; width: 50%; height: 60%; touch-action: none; }
  #knob, #base { position: fixed; border-radius: 50%; pointer-events: none; display: none; }
  #base { border: 2px solid rgba(255,255,255,.5); background: rgba(20,24,32,.25); }
  #knob { background: rgba(255,255,255,.6); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <div class="side"><div class="name">You</div><div class="bar hp"><i id="hp0"></i></div><div class="bar st"><i id="st0"></i></div><div class="bar po"><i id="po0"></i></div></div>
  <div class="side right"><div class="name">Opponent</div><div class="bar hp"><i id="hp1"></i></div><div class="bar st"><i id="st1"></i></div><div class="bar po"><i id="po1"></i></div></div>
</div>
<div id="msg"></div>
<div id="stick"></div><div id="base"></div><div id="knob"></div>
<div id="build"></div>
<script type="module" src="./src/client/main.js"></script>
</body>
</html>

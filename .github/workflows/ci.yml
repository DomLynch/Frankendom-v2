name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Every green main goes live at https://v2.frankendom.com (site root, no prefix).
  # The key is locked by rrsync to /srv/frankendom-v2/live on the VPS, so the remote path is "./".
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      KEY: ${{ secrets.V2_DEPLOY_KEY }}
      KH: ${{ secrets.V2_DEPLOY_KNOWN_HOSTS }}
      U: ${{ secrets.V2_DEPLOY_USER }}
      H: ${{ secrets.V2_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          # code lives under a folder named for the build, so a phone never runs a cached older module after a deploy
          # (the server sends no Cache-Control; data is fetched no-cache and stays at the root)
          mkdir -p "site/b/${GITHUB_SHA}"
          cp -r index.html data assets site/
          cp -r src "site/b/${GITHUB_SHA}/"
          sed -i "s#\./src/client/main.js#./b/${GITHUB_SHA}/src/client/main.js#" site/index.html
          grep -q "b/${GITHUB_SHA}/src/client/main.js" site/index.html
          echo "${GITHUB_SHA}" > site/build.txt
      - name: Publish
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          printf '%s\n' "$KH" > kh
          rsync -az --delete -e "ssh -i key -o IdentitiesOnly=yes -o UserKnownHostsFile=kh -o StrictHostKeyChecking=yes" site/ "$U@$H":./
          rm -f key kh
      # The server falls back to index.html for unknown paths, so only an exact SHA match counts.
      # --resolve pins the VPS address, so a stale public DNS cache can't fail the check.
      - name: Check served build
        run: |
          ip=$(getent ahostsv4 "$H" | awk 'NR==1{print $1}'); ip=${ip:-$H}
          for i in $(seq 1 20); do
            served=$(curl -fsS --resolve "v2.frankendom.com:443:$ip" https://v2.frankendom.com/build.txt || true)
            if [ "$served" = "$GITHUB_SHA" ]; then echo "live: $served"; exit 0; fi
            echo "try $i: got '${served:0:40}'"; sleep 15
          done
          exit 1
